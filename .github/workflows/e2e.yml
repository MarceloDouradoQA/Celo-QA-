name: Celo Craft E2E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Save test reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            cypress/results
            cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
